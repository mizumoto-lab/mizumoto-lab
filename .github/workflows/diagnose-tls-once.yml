name: diagnose-tls-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-tls-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          echo 'A records:'
          dig +short A mizumoto-lab.com
          echo 'AAAA records:'
          dig +short AAAA mizumoto-lab.com
          echo 'CNAME:'
          dig +short CNAME mizumoto-lab.com
          echo 'CAA:'
          dig +short CAA mizumoto-lab.com
      - name: TLS certificate
        run: |
          set +e
          echo | openssl s_client -connect mizumoto-lab.com:443 -servername mizumoto-lab.com -verify_return_error -showcerts 2>&1 | tee /tmp/tls.txt
          awk '/BEGIN CERTIFICATE/{flag=1} flag{print} /END CERTIFICATE/{exit}' /tmp/tls.txt > /tmp/cert.pem
          echo 'Certificate summary:'
          openssl x509 -in /tmp/cert.pem -noout -subject -issuer -dates -serial -fingerprint -sha256 -ext subjectAltName || true
      - name: HTTPS request
        run: |
          curl -Iv --max-time 30 https://mizumoto-lab.com/ || true
      - name: Chrome verification
        run: |
          google-chrome --version || true
          timeout 30 google-chrome --headless --disable-gpu --no-sandbox --dump-dom https://mizumoto-lab.com/ > /tmp/chrome.html 2> /tmp/chrome.err
          status=$?
          echo "Chrome exit status: $status"
          echo 'Chrome stderr:'
          cat /tmp/chrome.err
          echo 'Chrome output head:'
          head -20 /tmp/chrome.html
          exit $status
